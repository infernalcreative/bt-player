# /opt/bt-player/speakers.conf

[SETTINGS]
# Путь к каталогу с MP3 файлами
mp3_dir = /opt/bt-player/mp3
# Полный путь к ONNX файлу голосовой модели Piper TTS
model_path = /opt/bt-player/models/voice.onnx
#Путь к piper tts
piper_binary = /opt/bt-player/venv/bin/piper

[SPEAKERS]
# Формат: название = MAC-адрес, активная_громкость, громкость_по_умолчанию
neo = 00:22:6D:F3:FD:38, 0, 0
mini = 54:F2:9F:0B:48:BC, 64, 45

